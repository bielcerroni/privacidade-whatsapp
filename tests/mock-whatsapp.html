<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Mensagem - Chat importante</title></head>
<body style="margin:0;background:#f6f8fa;font-family:Arial,sans-serif">
<div id="app">
  <aside id="pane-side" style="width:290px;position:absolute;top:0;bottom:0;border-right:1px solid #ccc;padding:20px">
    <div role="gridcell" style="display:flex;gap:12px">
      <div style="width:45px;height:45px;border-radius:50%;overflow:hidden"><img id="avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3Crect width='1' height='1' fill='red'/%3E%3C/svg%3E" width="45" height="45"></div>
      <div><div class="_ak8q"><span id="name" title="Contato pessoal">Contato pessoal</span></div><div id="preview" class="_ak8k">Última mensagem importante</div></div>
    </div>
  </aside>
  <main id="main" style="margin-left:330px;padding:25px">
    <header style="display:flex;align-items:center;gap:12px;height:55px">
      <div id="header-avatar-frame" style="width:44px;height:44px;border-radius:50%;overflow:hidden"><img id="header-avatar" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" width="44" height="44" alt="avatar"></div>
      <button data-testid="conversation-info-header-button" aria-label="Informações de contato" aria-labelledby="mock-name mock-status" style="height:45px;padding:8px 12px;border:0;background:transparent;text-align:left">
        <div><span id="mock-name" data-testid="conversation-info-header-chat-title" style="font-size:16px;font-weight:700">Grupo de colegas</span></div>
        <div><span id="mock-status" style="font-size:11px">Online agora</span></div>
      </button>
    </header>
    <div class="message-in" style="display:flex;align-items:center;gap:12px;margin-top:30px">
      <div id="participant-frame" style="width:34px;height:34px;border-radius:50%;overflow:hidden"><img id="participant-avatar" width="34" height="34" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="></div>
      <div data-testid="msg-container" id="message" style="background:#d2f4e2;padding:17px;width:320px;border-radius:12px;display:flex;flex-direction:column;gap:8px">
        <span class="selectable-text" id="message-text">Informação pessoal na conversa</span>
        <img id="media" alt="imagem" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" width="100" height="100">
        <div id="message-meta" style="font-size:11px;align-self:flex-end">15:49 ✓✓</div>
      </div>
    </div>
    <footer><div contenteditable="true" id="editor" style="margin-top:25px;background:white;padding:12px;width:300px">Rascunho sigiloso</div></footer>
  </main>
</div>
</body></html>
